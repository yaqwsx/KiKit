name: test-kikit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  test:
    name: "Run KiKit tests"
    strategy:
      matrix:
        kicad-version: [v9, v10, v10-testing]
        # setup.py says `python_requires='>=3.8'`
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { python-version: "3.8", runner: ubuntu-24.04 }
          - { python-version: "3.9", runner: ubuntu-24.04 }
          - { python-version: "3.10", runner: ubuntu-24.04 }
          - { python-version: "3.11", runner: ubuntu-24.04 }
          - { python-version: "3.12", runner: ubuntu-24.04 }
          - { python-version: "3.13", runner: ubuntu-24.04 }
          - { python-version: "3.14", runner: ubuntu-26.04 }
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py
      - name: Install KiCad
        uses: ./.github/actions/setup-kicad
        with:
          kicad-version: ${{ matrix.kicad-version }}
      - name: Show Python/wxPython/KiCad versions
        run: |
          python3 -c '
          import sys; print("Python "+sys.version)
          import wx; print("wxPython "+wx.version())
          import pcbnew; print("KiCad "+pcbnew.GetBuildVersion())
          '
      - name: Install other dependencies
        run: |
          sudo apt-get -qq install --yes --no-install-recommends \
            zip inkscape make git libmagickwand-dev \
            libgraphicsmagick1-dev libmagickcore-dev \
            openscad bats
          python3 -m pip install PcbDraw
      - name: Install KiKit
        run: |
          python3 -m pip install -e .\[dev\]
      - run: make test
      - run: make package
  build-pcm:
    name: Build PCM packages
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-kicad
        with:
          kicad-version: v9
      - name: Build PCM package
        run: make pcm
      - name: Upload kikit-pcm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kikit-pcm
          path: build/pcm-kikit
          retention-days: 7
      - name: Upload kikit-lib-pcm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kikit-lib-pcm
          path: build/pcm-kikit-lib
          retention-days: 7
  deploy-docker:
    name: "Deploy nightly Docker"
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        build-config:
          - name: "x64 v9"
            suffix: "-v9"
            platform: linux/amd64
            repo: ubuntu
            kicad_version: "9.0"
            additional_packages: ""
            additional_python_packages: ""
          - name: "m1 v9"
            suffix: -m1-v9
            platform: linux/arm64/v8
            repo: arm64v8/ubuntu
            kicad_version: "9.0"
            additional_packages: gcc-aarch64-linux-gnu libgeos-dev
            additional_python_packages: python3-dev
          - name: "x64 v10"
            suffix: "-v10"
            platform: linux/amd64
            repo: ubuntu
            kicad_version: "10.0"
            additional_packages: ""
            additional_python_packages: ""
          - name: "m1 v10"
            suffix: -m1-v10
            platform: linux/arm64/v8
            repo: arm64v8/ubuntu
            kicad_version: "10.0"
            additional_packages: gcc-aarch64-linux-gnu libgeos-dev
            additional_python_packages: python3-dev
    steps:
      - uses: actions/checkout@v6 # Required for kikit version estimation
        with:
          fetch-depth: 0 # = fetch all
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: . # We need path context, so .git gets included
          push: true
          tags: yaqwsx/kikit:nightly${{ matrix.build-config.suffix }}
          platforms: ${{ matrix.build-config.platform }}
          build-args: |
            REPO=${{ matrix.build-config.repo }}
            ADDITIONAL_PACKAGES=${{ matrix.build-config.additional_packages }}
            ADDITIONAL_PYTHON_PACKAGES=${{ matrix.build-config.additional_python_packages }}
            KICAD_VERSION=${{ matrix.build-config.kicad_version }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
